services:
  app:
    build: .
    image: ai-research-design-assistant
    container_name: ai-research-design-assistant
    ports:
      - "8501:8501"
    volumes:
      - ./outputs:/app/outputs
    environment:
      ACADEMIC_CLOUD_API_KEY: ${ACADEMIC_CLOUD_API_KEY:?ACADEMIC_CLOUD_API_KEY is required}
      ACADEMIC_CLOUD_BASE_URL: ${ACADEMIC_CLOUD_BASE_URL:-https://chat-ai.academiccloud.de/v1}
      ACADEMIC_CLOUD_MODEL: ${ACADEMIC_CLOUD_MODEL:-qwen3-30b-a3b-instruct-2507}
      ACADEMIC_CLOUD_TIMEOUT: ${ACADEMIC_CLOUD_TIMEOUT:-180}
    restart: unless-stopped
